title: "[Feature Request] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea for Evrima Companion.

        This Discussion category is for **feature requests and ideas only**.

        Please do **not** use Discussions for bug reports, crashes, update problems or support requests. Use Evrima Companion's built-in **Report Bug** page for those so the report can be tracked privately and replied to directly in the app.

  - type: textarea
    id: feature
    attributes:
      label: What feature would you like to see?
      description: Describe the feature or improvement you would like added to Evrima Companion.
      placeholder: Tell us what you would like Companion to do.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Why would this be useful?
      description: Explain what problem it would solve or how it would improve the Companion.
      placeholder: How would this help you or other Evrima players?
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Extra details or examples
      description: Add any examples, mock-ups, workflow ideas or other context that might help explain the request.
      placeholder: Optional extra information.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before posting
      options:
        - label: I confirm this is a feature request or idea, not a bug report or support request.
          required: true
